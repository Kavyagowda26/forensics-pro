services:
  backend:
    build: ./backend
    container_name: forensics-backend
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./queue:/app/queue
      - ./results:/app/results
    depends_on:
      - analyzer
    restart: unless-stopped

  analyzer:
    build: ./analyzer
    container_name: forensics-analyzer
    volumes:
      - ./queue:/app/queue
      - ./results:/app/results
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: forensics-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
