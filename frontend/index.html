<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forensics Pro 5.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 36px; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .content { padding: 30px; }
        .section { margin-bottom: 30px; }
        .section h2 { font-size: 20px; color: #333; margin-bottom: 15px; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        input[type="file"] { display: block; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; width: 100%; }
        button { padding: 12px 30px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { padding: 12px; margin: 15px 0; border-radius: 4px; display: none; }
        .status.show { display: block; animation: slideIn 0.3s ease; }
        .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status.loading { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        @keyframes slideIn { from { opacity: 0; } to { opacity: 1; } }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box { background: #f9f9f9; padding: 15px; border-radius: 4px; text-align: center; border-left: 4px solid #667eea; }
        .stat-box .value { font-size: 24px; font-weight: bold; color: #667eea; }
        .stat-box .label { font-size: 12px; color: #666; margin-top: 5px; }
        .analyses-list { margin-top: 20px; }
        .analysis-item { background: #f9f9f9; padding: 15px; margin: 10px 0; border-left: 4px solid #667eea; border-radius: 4px; }
        .analysis-item strong { color: #333; }
        .analysis-item .risk { margin: 8px 0; font-weight: bold; }
        .analysis-item .risk.critical { color: #d32f2f; }
        .analysis-item .risk.high { color: #f57c00; }
        .analysis-item .risk.medium { color: #fbc02d; }
        .analysis-item .risk.low { color: #388e3c; }
        .analysis-item .status-badge { display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 12px; margin-left: 10px; font-weight: bold; }
        .status-badge.processing { background: #d1ecf1; color: #0c5460; }
        .status-badge.complete { background: #d4edda; color: #155724; }
        .empty { color: #999; font-style: italic; text-align: center; padding: 20px; }
        .indicator { background: #fff; padding: 8px; margin: 5px 0; border-left: 3px solid #fbc02d; border-radius: 3px; font-size: 13px; }
        .indicator.critical { border-left-color: #d32f2f; background: #ffebee; }
        .indicator.high { border-left-color: #f57c00; background: #fff3e0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Forensics Pro 5.0</h1>
            <p>Enterprise Memory Forensics Platform</p>
        </div>
        
        <div class="content">
            <div class="section">
                <h2>Upload File</h2>
                <input type="file" id="fileInput">
                <button onclick="uploadFile()" id="uploadBtn">Upload and Analyze</button>
                <div id="status" class="status"></div>
            </div>
            
            <div class="section">
                <h2>Statistics</h2>
                <div class="stats">
                    <div class="stat-box">
                        <div class="value" id="totalCount">0</div>
                        <div class="label">Total Analyses</div>
                    </div>
                    <div class="stat-box">
                        <div class="value" id="criticalCount">0</div>
                        <div class="label">Critical Threats</div>
                    </div>
                    <div class="stat-box">
                        <div class="value" id="highCount">0</div>
                        <div class="label">High Risk</div>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <h2>Analysis Results</h2>
                <div id="analyses" class="analyses-list">
                    <div class="empty">No analyses yet</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:5000';
        let analyses = [];

        function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) { alert('Select a file'); return; }

            const status = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');
            
            status.textContent = 'Uploading and queuing for analysis...';
            status.className = 'status show loading';
            btn.disabled = true;

            const form = new FormData();
            form.append('file', file);

            fetch(API + '/api/upload', {
                method: 'POST',
                body: form
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    status.textContent = 'Error: ' + data.error;
                    status.className = 'status show error';
                } else {
                    analyses.unshift(data);
                    status.textContent = 'File uploaded! Results will appear below...';
                    status.className = 'status show success';
                    document.getElementById('fileInput').value = '';
                    updateUI();
                    
                    setTimeout(() => {
                        status.classList.remove('show');
                    }, 3000);
                }
                btn.disabled = false;
            })
            .catch(e => {
                status.textContent = 'Error: ' + e.message;
                status.className = 'status show error';
                btn.disabled = false;
            });
        }

        function updateUI() {
            document.getElementById('totalCount').textContent = analyses.length;
            document.getElementById('criticalCount').textContent = analyses.filter(a => a.risk_level === 'CRITICAL').length;
            document.getElementById('highCount').textContent = analyses.filter(a => a.risk_level === 'HIGH').length;

            if (analyses.length === 0) {
                document.getElementById('analyses').innerHTML = '<div class="empty">No analyses yet</div>';
            } else {
                let html = '';
                analyses.forEach(a => {
                    html += '<div class="analysis-item">';
                    html += '<strong>' + a.filename + '</strong>';
                    html += '<span class="status-badge ' + (a.status === 'processing' ? 'processing' : 'complete') + '">' + a.status.toUpperCase() + '</span>';
                    html += '<div class="risk ' + a.risk_level.toLowerCase() + '">Risk: ' + a.risk_level + ' | Score: ' + a.threat_score + '</div>';
                    html += '<div>Size: ' + (a.file_size / 1024).toFixed(2) + ' KB | Indicators: ' + (a.indicators ? a.indicators.length : 0) + '</div>';
                    
                    if (a.indicators && a.indicators.length > 0) {
                        html += '<div>';
                        a.indicators.forEach(i => {
                            html += '<div class="indicator ' + i.severity.toLowerCase() + '">' + i.type + ': ' + i.description + '</div>';
                        });
                        html += '</div>';
                    }
                    
                    html += '</div>';
                });
                document.getElementById('analyses').innerHTML = html;
            }
        }

        fetch(API + '/api/analysis').then(r => r.json()).then(d => { analyses = d || []; updateUI(); });
        setInterval(() => { fetch(API + '/api/analysis').then(r => r.json()).then(d => { analyses = d || []; updateUI(); }); }, 1000);
    </script>
</body>
</html>
